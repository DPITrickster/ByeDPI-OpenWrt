name: build

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Force a build even if nothing changed upstream (rebuilds the current release)'
        type: boolean
        default: false
      ref:
        description: 'Build an arbitrary upstream ref (commit sha or tag) as a pre-release'
        type: string
        default: ''
  schedule:
    - cron: '0 0 */14 * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # 1. Check upstream: pick build mode (release / prerelease / skip)
  check:
    runs-on: ubuntu-latest
    outputs:
      mode:            ${{ steps.decide.outputs.mode }}
      tag:             ${{ steps.decide.outputs.tag }}
      tag_suffix:      ${{ steps.decide.outputs.tag_suffix }}
      version:         ${{ steps.decide.outputs.version }}
      source_ref:      ${{ steps.decide.outputs.source_ref }}
      source_dir:      ${{ steps.decide.outputs.source_dir }}
      prerelease:      ${{ steps.decide.outputs.prerelease }}
      commit:          ${{ steps.decide.outputs.commit }}
      short:           ${{ steps.decide.outputs.short }}
      bootstrap:       ${{ steps.decide.outputs.bootstrap }}
      ipk_branches:    ${{ steps.decide.outputs.ipk_branches }}
      apk_branches:    ${{ steps.decide.outputs.apk_branches }}
      release_targets: ${{ steps.decide.outputs.release_targets }}
    steps:
      - name: Checkout repository (to read .last_release_tag / .last_commit)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Decide build mode
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: 'hufrea/byedpi'
          FORCE: ${{ github.event.inputs.force }}
          REF_IN: ${{ github.event.inputs.ref }}
        run: |
          # GitHub API call with up to 3 retries (handles transient network/API flaps)
          api() {
            local out
            for _ in 1 2 3; do
              out=$(wget -qO- --header="Authorization: token $GH_TOKEN" "$1") && [ -n "$out" ] && { printf '%s' "$out"; return 0; }
              sleep 3
            done
            return 1
          }

          TAG=$(api "https://api.github.com/repos/$REPO/releases/latest" | grep -Po '"tag_name": "\K.+?(?=")')
          DEFAULT_BRANCH=$(api "https://api.github.com/repos/$REPO" | grep -Po '"default_branch": "\K.+?(?=")')
          COMMIT=$(api "https://api.github.com/repos/$REPO/commits/$DEFAULT_BRANCH" | grep -Po '"sha": "\K[0-9a-f]+' | head -1)
          SHORT=${COMMIT:0:7}
          echo "Upstream latest release tag: $TAG"
          echo "Upstream default branch '$DEFAULT_BRANCH' HEAD: $COMMIT"

          if [ -z "$TAG" ] || [ -z "$COMMIT" ]; then
            echo "::error::Could not query upstream tag/commit from GitHub API."
            exit 1
          fi

          [ -f .last_release_tag ] && LAST_TAG=$(cat .last_release_tag) || LAST_TAG=""

          # A missing .last_commit means tracking was never seeded. Treat it as
          # "already at the current commit" so the absence of the file alone does
          # NOT misfire a pre-release; the bootstrap job below creates it.
          if [ -f .last_commit ]; then
            LAST_COMMIT=$(cat .last_commit)
            BOOTSTRAP=false
          else
            LAST_COMMIT="$COMMIT"
            BOOTSTRAP=true
            echo "No .last_commit found — bootstrapping tracking to current commit."
          fi
          echo "Last processed tag:    $LAST_TAG"
          echo "Last processed commit: $LAST_COMMIT"

          # Defaults, refined below depending on the chosen mode.
          MODE=SKIP PRERELEASE=false TAG_SUFFIX="" VERSION="${TAG#v}"
          SOURCE_REF="$TAG" SOURCE_DIR="${TAG#v}"

          if [ -n "$REF_IN" ]; then
            # Manual dispatch: build an arbitrary ref as a pre-release (testing/debug).
            echo "==> Manual ref requested: pre-release build from '$REF_IN'."
            MODE=prerelease PRERELEASE=true
            SOURCE_REF="$REF_IN" SOURCE_DIR="${REF_IN#v}"
            SHORT="${REF_IN:0:7}" TAG_SUFFIX="-pre-${REF_IN:0:7}"
          elif [ "$TAG" != "$LAST_TAG" ]; then
            echo "==> New upstream release: full release build."
            MODE=release
          elif [ "$COMMIT" != "$LAST_COMMIT" ]; then
            echo "==> Same version, new upstream commit: pre-release build from $SHORT."
            MODE=prerelease PRERELEASE=true
            SOURCE_REF="$COMMIT" SOURCE_DIR="$COMMIT" TAG_SUFFIX="-pre-$SHORT"
          elif [ "$FORCE" = "true" ]; then
            echo "==> Nothing changed but force requested: rebuilding current release."
            MODE=release
          else
            echo "==> Nothing changed: skipping build."
          fi

          {
            echo "mode=$MODE"
            echo "prerelease=$PRERELEASE"
            echo "tag_suffix=$TAG_SUFFIX"
            echo "version=$VERSION"
            echo "source_ref=$SOURCE_REF"
            echo "source_dir=$SOURCE_DIR"
            echo "tag=$TAG"
            echo "commit=$COMMIT"
            echo "short=$SHORT"
            echo "bootstrap=$BOOTSTRAP"
          } >> "$GITHUB_OUTPUT"

          # Dynamic build/release matrices: full set for releases, trimmed for pre-releases.
          if [ "$MODE" = "release" ]; then
            {
              echo 'ipk_branches=["openwrt-19.07","openwrt-21.02","openwrt-22.03","openwrt-23.05","openwrt-24.10"]'
              echo 'apk_branches=["openwrt-25.12"]'
              echo 'release_targets=[{"branch":"19.07","format":"ipk"},{"branch":"21.02","format":"ipk"},{"branch":"22.03","format":"ipk"},{"branch":"23.05","format":"ipk"},{"branch":"24.10","format":"ipk"},{"branch":"25.12","format":"apk"}]'
            } >> "$GITHUB_OUTPUT"
          elif [ "$MODE" = "prerelease" ]; then
            {
              echo 'ipk_branches=["openwrt-24.10"]'
              echo 'apk_branches=["openwrt-25.12"]'
              echo 'release_targets=[{"branch":"24.10","format":"ipk"},{"branch":"25.12","format":"apk"}]'
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo 'ipk_branches=[]'
              echo 'apk_branches=[]'
              echo 'release_targets=[]'
            } >> "$GITHUB_OUTPUT"
          fi

  # 2. IPK build (OpenWrt <= 24.10)
  build-ipk:
    needs: check
    if: ${{ needs.check.outputs.mode != 'SKIP' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.check.outputs.ipk_branches) }}
        arch:
          - aarch64_cortex-a53
          - aarch64_cortex-a72
          - aarch64_generic
          - arm_arm1176jzf-s_vfp
          - arm_arm926ej-s
          - arm_cortex-a15_neon-vfpv4
          - arm_cortex-a5_vfpv4
          - arm_cortex-a7
          - arm_cortex-a7_neon-vfpv4
          - arm_cortex-a7_vfpv4
          - arm_cortex-a8_vfpv3
          - arm_cortex-a9
          - arm_cortex-a9_neon
          - arm_cortex-a9_vfpv3-d16
          - arm_fa526
          - arm_mpcore
          - arm_xscale
          - mips64_octeonplus
          - mips_24kc
          - mips_4kec
          - mips_mips32
          - mipsel_24kc
          - mipsel_24kc_24kf
          - mipsel_74kc
          - mipsel_mips32
          - x86_64
        exclude:
          - branch: openwrt-19.07
            arch: arm_cortex-a7
          - branch: openwrt-19.07
            arch: arm_cortex-a7_vfpv4
          - branch: openwrt-19.07
            arch: mips_4kec
          - branch: openwrt-21.02
            arch: arm_cortex-a7_vfpv4
          - branch: openwrt-24.10
            arch: arm_mpcore
        include:
          - branch: openwrt-24.10
            arch: aarch64_cortex-a76
    container:
      image: openwrt/sdk:${{ matrix.arch }}-${{ matrix.branch }}
      options: --user root
    defaults: { run: { shell: bash } }
    env:
      VERSION:    ${{ needs.check.outputs.version }}
      SOURCE_REF: ${{ needs.check.outputs.source_ref }}
      SOURCE_DIR: ${{ needs.check.outputs.source_dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup SDK
        if: ${{ matrix.branch == 'openwrt-23.05' || matrix.branch == 'openwrt-24.10' }}
        working-directory: /builder
        env:
          BRANCH: ${{ matrix.branch }}
        run: |
          # Override VERSION_PATH for branches where SNAPSHOT URL is dead
          if [ "$BRANCH" = "openwrt-23.05" ]; then
            VERSION_PATH=releases/23.05.6 HOME=/builder ./setup.sh
          else
            HOME=/builder ./setup.sh
          fi

      - name: Prepare package (set version and source ref)
        run: |
          sed -e "s|@VERSION@|${VERSION}|" \
              -e "s|@SOURCE_REF@|${SOURCE_REF}|" \
              -e "s|@SOURCE_DIR@|${SOURCE_DIR}|" -i byedpi/Makefile
          echo "----- byedpi/Makefile (header) -----"
          sed -n '1,20p' byedpi/Makefile

      - name: Compile package and build feed index
        id: compile
        working-directory: ${{ matrix.branch == 'openwrt-19.07' && '/home/build/openwrt' || '/builder' }}
        env:
          ARCH: ${{ matrix.arch }}
          BRANCH: ${{ matrix.branch }}
          SIGN_KEY: ${{ secrets.SIGN_PRIVATE_KEY }}
        run: |
          echo "src-link byedpi $GITHUB_WORKSPACE" >> feeds.conf
          ./scripts/feeds update byedpi
          ./scripts/feeds install -a -p byedpi
          make defconfig
          make package/byedpi/compile V=s -j$(nproc) BUILD_LOG=1
          echo "$SIGN_KEY" | base64 -d > key-build

          # Build a proper opkg feed index (Packages, Packages.gz, and a usign
          # signature when a key is configured) via the SDK's own target. Running
          # it through make sets up the host PATH/mkhash, so hashing works — a
          # manual ipkg-make-index.sh call fails with "sha256: command not found".
          make package/index V=s

          PKG_DIR=$(find ./bin/packages -mindepth 2 -maxdepth 2 -type d -name byedpi -print -quit)
          if [ -z "$PKG_DIR" ]; then
            echo "::error::Built package directory not found."
            find ./bin -name 'byedpi*.ipk' | head
            exit 1
          fi
          echo "Package dir: $PKG_DIR"

          tar -C "$PKG_DIR" -cvf $GITHUB_WORKSPACE/ipk-$BRANCH-$ARCH.tar \
            --transform "s|^\./|${BRANCH/openwrt-}/$ARCH/|" --show-transformed-names .

      - name: Compress build logs
        if: ${{ always() }}
        env:
          ARCH: ${{ matrix.arch }}
          BRANCH: ${{ matrix.branch }}
          LOGS_DIR: ${{ matrix.branch == 'openwrt-19.07' && '/home/build/openwrt/logs' || '/builder/logs' }}
        run: |
          if [ -d "$LOGS_DIR" ]; then
            tar -cJvf logs-ipk-$BRANCH-$ARCH.tar.xz "$LOGS_DIR"
          else
            echo "No logs dir at $LOGS_DIR — skipping compression."
          fi

      - name: Upload packages
        if: ${{ steps.compile.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: ipk-${{ matrix.branch }}-${{ matrix.arch }}
          path: ipk-${{ matrix.branch }}-${{ matrix.arch }}.tar
          if-no-files-found: error

      - name: Upload build logs
        uses: actions/upload-artifact@v6
        with:
          name: logs-ipk-${{ matrix.branch }}-${{ matrix.arch }}
          path: logs-ipk-*.tar.xz
          if-no-files-found: ignore

  # 3. APK build (OpenWrt >= 25.12)
  build-apk:
    needs: check
    if: ${{ needs.check.outputs.mode != 'SKIP' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # apk_branches is ["openwrt-25.12"] today; add new apk branches in the check job.
        branch: ${{ fromJSON(needs.check.outputs.apk_branches) }}
        arch:
          - aarch64_cortex-a53
          - aarch64_cortex-a72
          - aarch64_cortex-a76
          - aarch64_generic
          - arm_arm1176jzf-s_vfp
          - arm_arm926ej-s
          - arm_cortex-a15_neon-vfpv4
          - arm_cortex-a5_vfpv4
          - arm_cortex-a7
          - arm_cortex-a7_neon-vfpv4
          - arm_cortex-a7_vfpv4
          - arm_cortex-a8_vfpv3
          - arm_cortex-a9
          - arm_cortex-a9_neon
          - arm_cortex-a9_vfpv3-d16
          - arm_fa526
          - arm_xscale
          - mips64_octeonplus
          - mips_24kc
          - mips_4kec
          - mips_mips32
          - mipsel_24kc
          - mipsel_24kc_24kf
          - mipsel_74kc
          - mipsel_mips32
          - riscv64_generic
          - x86_64
        exclude:
          - arch: arm_cortex-a9_vfpv3-d16
          - arch: mips_4kec
    container:
      image: ghcr.io/openwrt/sdk:${{ matrix.arch }}-${{ matrix.branch }}
      options: --user root
    defaults:
      run:
        shell: bash
    env:
      VERSION:    ${{ needs.check.outputs.version }}
      SOURCE_REF: ${{ needs.check.outputs.source_ref }}
      SOURCE_DIR: ${{ needs.check.outputs.source_dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fix SDK paths
        run: |
          mkdir -p /builder/shared-workdir
          rm -rf /builder/shared-workdir/build
          ln -sf /builder /builder/shared-workdir/build

      - name: Setup OpenWrt SDK
        working-directory: /builder
        run: |
          wget -qO- 'https://raw.githubusercontent.com/openwrt/keyring/refs/heads/master/gpg/0x1D53D1877742E911.asc' | gpg --verbose --import
          sed -i 's/gpg --/#gpg --/g' setup.sh
          sed -r -i 's/^rm.+//' setup.sh
          ./setup.sh

      - name: Prepare package (set version and source ref)
        run: |
          sed -e "s|@VERSION@|${VERSION}|" \
              -e "s|@SOURCE_REF@|${SOURCE_REF}|" \
              -e "s|@SOURCE_DIR@|${SOURCE_DIR}|" -i byedpi/Makefile
          echo "----- byedpi/Makefile (header) -----"
          sed -n '1,20p' byedpi/Makefile

      - name: Compile package and build feed index
        id: compile
        working-directory: /builder
        env:
          ARCH: ${{ matrix.arch }}
          BRANCH: ${{ matrix.branch }}
          SIGN_KEY: ${{ secrets.SIGN_PRIVATE_KEY }}
        run: |
          echo "src-link byedpi $GITHUB_WORKSPACE" >> feeds.conf
          ./scripts/feeds update byedpi
          ./scripts/feeds install -a -p byedpi
          make defconfig
          sed -i 's/CONFIG_LUCI_JSMIN=y/CONFIG_LUCI_JSMIN=n/g' .config 2>/dev/null || true
          sed -i 's/CONFIG_LUCI_CSSTIDY=y/CONFIG_LUCI_CSSTIDY=n/g' .config 2>/dev/null || true
          make package/byedpi/compile V=s -j$(nproc) BUILD_LOG=1

          if [ -n "$SIGN_KEY" ]; then
            echo "$SIGN_KEY" | base64 -d > key-build
          fi

          # Build the apk feed index via the SDK's own target (sets up host PATH/tools).
          make package/index V=s

          PKG_DIR=$(find ./bin/packages -mindepth 2 -maxdepth 2 -type d -name byedpi -print -quit)
          if [ -z "$PKG_DIR" ] || ! compgen -G "$PKG_DIR/*.apk" > /dev/null; then
            echo "::error::No APK files found for $ARCH"
            find ./bin -type f -name "*.apk" | head -5
            exit 1
          fi
          echo "Package dir: $PKG_DIR"

          tar -C "$PKG_DIR" -cvf $GITHUB_WORKSPACE/apk-$BRANCH-$ARCH.tar \
            --transform "s|^\./|${BRANCH/openwrt-}/$ARCH/|" --show-transformed-names .

      - name: Compress build logs
        if: always()
        env:
          ARCH: ${{ matrix.arch }}
          BRANCH: ${{ matrix.branch }}
        run: |
          if [ -d "/builder/logs" ]; then
            tar -cJvf logs-apk-$BRANCH-$ARCH.tar.xz /builder/logs
          else
            echo "No logs dir at /builder/logs — skipping compression."
          fi

      - name: Upload APK packages
        if: steps.compile.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: apk-${{ matrix.branch }}-${{ matrix.arch }}
          path: apk-${{ matrix.branch }}-${{ matrix.arch }}.tar
          if-no-files-found: error

      - name: Upload build logs
        uses: actions/upload-artifact@v6
        with:
          name: logs-apk-${{ matrix.branch }}-${{ matrix.arch }}
          path: logs-apk-*.tar.xz
          if-no-files-found: ignore

  # 4. Deploy to GitHub Pages (stable feed) — releases only, never pre-releases
  gh-pages:
    needs: [check, build-ipk, build-apk]
    if: ${{ needs.check.outputs.mode == 'release' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download IPK artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: ipk-*
          path: ./artifacts

      - name: Download APK artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: apk-*
          path: ./artifacts

      - name: Prepare files
        run: |
          mkdir -p public
          find ./artifacts -name 'ipk-*.tar' -exec tar -C ./public -xvf {} \;
          find ./artifacts -name 'apk-*.tar' -exec tar -C ./public -xvf {} \;
          cat <<EOF >> public/public.key
          untrusted comment: ByeDPI OpenWrt repo
          RWRT/Cfg5ReIbqWME8QTUQ1FKxp8FTr9M9g1vDsL8uIdRyP5TTNAk4QA
          EOF

      - name: Deploy to GH pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          full_commit_message: 'ByeDPI ${{ needs.check.outputs.tag }}'
          force_orphan: true
          publish_dir: ./public

  # 5. Release (full release or pre-release)
  release:
    needs: [check, build-ipk, build-apk]
    if: ${{ needs.check.outputs.mode != 'SKIP' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        # Each entry is a separate release: {branch, format}.
        # format: ipk -> OpenWrt <= 24.10 ; apk -> OpenWrt >= 25.12.
        # Built dynamically by the check job (full set for releases, trimmed for pre-releases).
        include: ${{ fromJSON(needs.check.outputs.release_targets) }}
    steps:
      - name: Download IPK artifacts for OpenWrt ${{ matrix.branch }}
        if: ${{ matrix.format == 'ipk' }}
        uses: actions/download-artifact@v6
        with:
          pattern: ipk-openwrt-${{ matrix.branch }}-*
          path: ./artifacts
          merge-multiple: false

      - name: Download APK artifacts for OpenWrt ${{ matrix.branch }}
        if: ${{ matrix.format == 'apk' }}
        uses: actions/download-artifact@v6
        with:
          pattern: apk-openwrt-${{ matrix.branch }}-*
          path: ./artifacts
          merge-multiple: false

      - name: Prepare release files
        env:
          BRANCH: ${{ matrix.branch }}
          FORMAT: ${{ matrix.format }}
        run: |
          mkdir -p ./release_files

          echo "=== Artifacts ==="
          ls -R ./artifacts/ | head -100
          echo "================="

          if [ "$FORMAT" = "ipk" ]; then
            for tar_file in ./artifacts/ipk-openwrt-${BRANCH}-*/ipk-openwrt-${BRANCH}-*.tar; do
              [ -f "$tar_file" ] || continue
              echo "Extracting IPK: $tar_file"
              tar -xvf "$tar_file" -C ./release_files
            done
            # Flatten: move all .ipk to release_files root
            find ./release_files -mindepth 2 -name '*.ipk' -exec mv -t ./release_files {} +
            find ./release_files -mindepth 1 -type d -exec rm -rf {} + 2>/dev/null || true
          else
            for tar_file in ./artifacts/apk-openwrt-${BRANCH}-*/apk-openwrt-${BRANCH}-*.tar; do
              [ -f "$tar_file" ] || continue
              echo "Extracting APK: $tar_file"
              tmpdir=$(mktemp -d)
              tar -xvf "$tar_file" -C "$tmpdir"
              find "$tmpdir" -type f -name '*.apk' | while read apk; do
                arch=$(basename "$(dirname "$apk")")
                base=$(basename "$apk" .apk)
                new_base=$(echo "$base" | sed 's/-/_/')
                cp "$apk" "./release_files/${new_base}_${arch}.apk"
              done
              rm -rf "$tmpdir"
            done
          fi

          echo "=== Release files for OpenWrt $BRANCH ==="
          ls -la ./release_files/
          echo "==========================================="

      - name: Generate release notes
        env:
          MODE: ${{ needs.check.outputs.mode }}
          SHORT: ${{ needs.check.outputs.short }}
          FORMAT: ${{ matrix.format }}
          BRANCH: ${{ matrix.branch }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          {
            if [ "$MODE" = "prerelease" ]; then
              echo "### 🧪 ByeDPI $TAG (pre-release) for OpenWrt $BRANCH"
              echo ""
              echo "> Сборка из коммита \`$SHORT\` ветки upstream. Номер версии не менялся,"
              echo "> но код обновился — это **тестовый пред-релиз**, не входит в стабильный фид."
              echo ">"
              echo "> Built from upstream commit \`$SHORT\`. The version number did not change"
              echo "> but the code did — this is a **test pre-release**, not part of the stable feed."
            else
              echo "### ByeDPI $TAG for OpenWrt $BRANCH"
            fi
            echo ""
            echo "-----"
            echo "**Check the package architecture of your device:**"
            echo '```shell'
            if [ "$FORMAT" = "ipk" ]; then
              echo "opkg print-architecture"
            else
              echo "apk --print-arch"
            fi
            echo "awk -F\' '/DISTRIB_ARCH/ {print \$2}' /etc/openwrt_release"
            echo '```'
          } > release_notes.md

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          prerelease: ${{ needs.check.outputs.prerelease == 'true' }}
          tag_name: ${{ needs.check.outputs.tag }}${{ needs.check.outputs.tag_suffix }}-${{ matrix.branch }}
          name: ${{ needs.check.outputs.tag }}${{ needs.check.outputs.tag_suffix }} for OpenWrt ${{ matrix.branch }}
          target_commitish: gh-pages
          body_path: release_notes.md
          files: ./release_files/*

  # 6. Record what we processed so the next run can skip / decide correctly.
  #    Runs for both release and pre-release; gh-pages is skipped for pre-releases.
  finalize:
    needs: [check, build-ipk, build-apk, gh-pages, release]
    if: >-
      ${{ always()
          && needs.check.outputs.mode != 'SKIP'
          && needs.build-ipk.result == 'success'
          && needs.build-apk.result == 'success'
          && needs.release.result == 'success'
          && (needs.gh-pages.result == 'success' || needs.gh-pages.result == 'skipped') }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Update tracking files
        env:
          MODE: ${{ needs.check.outputs.mode }}
          TAG: ${{ needs.check.outputs.tag }}
          COMMIT: ${{ needs.check.outputs.commit }}
          SHORT: ${{ needs.check.outputs.short }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "$COMMIT" > .last_commit
          if [ "$MODE" = "release" ]; then
            echo "$TAG" > .last_release_tag
          fi
          git add .last_commit .last_release_tag
          git commit -m "Track upstream $TAG @ $SHORT [skip ci]" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }}

  # 7. Bootstrap: when tracking files are missing and there is nothing to build,
  #    create them so the next run decides correctly (a build path is handled by
  #    finalize instead). This is what makes a missing .last_commit self-heal.
  bootstrap:
    needs: check
    if: ${{ needs.check.outputs.mode == 'SKIP' && needs.check.outputs.bootstrap == 'true' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Seed missing tracking files
        env:
          TAG: ${{ needs.check.outputs.tag }}
          COMMIT: ${{ needs.check.outputs.commit }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f .last_commit ]      || echo "$COMMIT" > .last_commit
          [ -f .last_release_tag ] || echo "$TAG"    > .last_release_tag
          git add .last_commit .last_release_tag
          git commit -m "Seed tracking files (last_commit=$COMMIT) [skip ci]" || echo "Nothing to seed"
          git push origin HEAD:${{ github.ref_name }}
